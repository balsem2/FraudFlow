name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall -q fraudflow
      - run: python -m unittest discover -s tests -v
      - run: python -m fraudflow.train --help
      - run: python -m fraudflow.predict --help
